<title>IT Process Portfolio Cockpit</title>
<meta name="description" content="Management-Cockpit für das Corporate-IT-Prozessportfolio: Status, Verzögerungen, Auslastung und Timeline über alle Prozessgruppen." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" /></noscript>
<style>
/* ============================================================================
   WERKBLATT
   ----------------------------------------------------------------------------
   Kein Karten-Interface, sondern ein Bogen: gezogene Linien, ein Schriftfeld,
   Messwerte in Maschinenschrift. Gruppen entstehen durch Linien und Weißraum,
   nicht durch Rahmen und Schatten.

   Corporate Design: Gelb ist Registermarke und erscheint nur als Fläche mit
   anthrazitfarbener Schrift (11,2:1) - als Linie oder Text auf Weiß erreicht
   es 1,5:1. Dafür stehen --accent-line und --accent-ink bereit.
   Weichen die offiziellen CI-Werte ab, genügt es diesen Block zu ändern.     */
:root{
  color-scheme: light;
  /* Marke */
  --brand:#FFCC00; --brand-edge:#B58E00; --on-accent:#16181A;
  --grp-mp:#BDC4CA; --grp-cp:#FFCC00; --grp-sp:#8BB2C2;
  /* Bogen und Schrift */
  --paper:#FAFAF8; --paper-2:#F2F1EC; --paper-3:#E8E7E0; --void:#EDECE6;
  --ink:#16181A; --ink-2:#5A5F63; --ink-3:#8E9498;
  --rule:#DEDCD4; --rule-2:#BFBDB2; --rule-3:#16181A;
  --accent:#FFCC00; --accent-soft:#FCF2CE; --accent-ink:#7A5E00; --accent-line:#7A5E00;
  --focus:#7A5E00;
  /* Datenfarben - Phasen (auf dem Bogen geprüft) */
  --ph1:#2a78d6; --ph2:#eb6834; --ph3:#1baf7a; --ph4:#7c5cd6;
  --ph1-soft:#dce8fa; --ph2-soft:#fbe4da; --ph3-soft:#d8f0e7; --ph4-soft:#e6e0fa;
  /* Status - reserviert, immer mit Zeichen und Wort */
  --st-done:#0ca30c; --st-prog:#2a78d6; --st-delay:#d03b3b;
  --st-sched:#8E9498; --st-none:#C6C4BA;
  --st-done-soft:#ddf2dd; --st-prog-soft:#dce8fa; --st-delay-soft:#f9dedd;
  --st-sched-soft:#EDECE6; --st-none-soft:#F2F1EC;
  --warn:#8a6400; --today:#16181A;
  --or1:#86b6ef; --or2:#5598e7; --or3:#2a78d6; --or4:#1c5cab;
  --grid:#EAE8E0; --axis:#BFBDB2;
  --band:#F5F4EF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --brand:#FFCC00; --brand-edge:#FFCC00; --on-accent:#16181A;
    --grp-mp:#BDC4CA; --grp-cp:#FFCC00; --grp-sp:#8BB2C2;
    --paper:#16181A; --paper-2:#1E2124; --paper-3:#282C30; --void:#0C0D0F;
    --ink:#F2F1EC; --ink-2:#AEB3B7; --ink-3:#7E8489;
    --rule:#2A2E32; --rule-2:#3D4247; --rule-3:#F2F1EC;
    --accent:#FFCC00; --accent-soft:#3A2F06; --accent-ink:#FFD84D; --accent-line:#FFCC00;
    --focus:#FFCC00;
    --ph1:#3987e5; --ph2:#d95926; --ph3:#199e70; --ph4:#9085e9;
    --ph1-soft:#17273A; --ph2-soft:#331910; --ph3-soft:#0E2B22; --ph4-soft:#241F3D;
    --st-done:#0ca30c; --st-prog:#3987e5; --st-delay:#d03b3b;
    --st-sched:#7E8489; --st-none:#454B50;
    --st-done-soft:#0D2511; --st-prog-soft:#17273A; --st-delay-soft:#341617;
    --st-sched-soft:#242829; --st-none-soft:#1F2224;
    --warn:#FFCC00; --today:#FFCC00;
    --or1:#184f95; --or2:#256abf; --or3:#3987e5; --or4:#6da7ec;
    --grid:#242829; --axis:#3D4247;
    --band:#1B1E20;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand:#FFCC00; --brand-edge:#FFCC00; --on-accent:#16181A;
  --grp-mp:#BDC4CA; --grp-cp:#FFCC00; --grp-sp:#8BB2C2;
  --paper:#16181A; --paper-2:#1E2124; --paper-3:#282C30; --void:#0C0D0F;
  --ink:#F2F1EC; --ink-2:#AEB3B7; --ink-3:#7E8489;
  --rule:#2A2E32; --rule-2:#3D4247; --rule-3:#F2F1EC;
  --accent:#FFCC00; --accent-soft:#3A2F06; --accent-ink:#FFD84D; --accent-line:#FFCC00;
  --focus:#FFCC00;
  --ph1:#3987e5; --ph2:#d95926; --ph3:#199e70; --ph4:#9085e9;
  --ph1-soft:#17273A; --ph2-soft:#331910; --ph3-soft:#0E2B22; --ph4-soft:#241F3D;
  --st-done:#0ca30c; --st-prog:#3987e5; --st-delay:#d03b3b;
  --st-sched:#7E8489; --st-none:#454B50;
  --st-done-soft:#0D2511; --st-prog-soft:#17273A; --st-delay-soft:#341617;
  --st-sched-soft:#242829; --st-none-soft:#1F2224;
  --warn:#FFCC00; --today:#FFCC00;
  --or1:#184f95; --or2:#256abf; --or3:#3987e5; --or4:#6da7ec;
  --grid:#242829; --axis:#3D4247;
  --band:#1B1E20;
}

/* ============================================================ Grundlage */
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11";
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance;}
button,select,input{font:inherit;color:inherit;}
:focus-visible{outline:1.5px solid var(--focus);outline-offset:2px;border-radius:1px;}
.tnum,.mono{font-family:"DM Mono",ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* Der Bogen: ein Blatt, nicht viele Kärtchen. */
.shell{
  max-width:1560px;margin:0 auto;padding:0 46px 90px;background:var(--paper);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:100vh;
}
@media(max-width:900px){.shell{padding:0 18px 60px;}}

/* Randspalte trägt die Abschnittsbezeichnung, Inhalt sitzt rechts daneben. */
.sec{
  display:grid;grid-template-columns:132px minmax(0,1fr);gap:26px;align-items:baseline;
  margin:34px 0 16px;padding-top:12px;border-top:1.5px solid var(--rule-3);
}
.sec > .lbl{
  font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding-top:4px;
}
.sec h2{font-size:21px;font-weight:600;letter-spacing:-.02em;}
.sec .n{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-left:10px;font-weight:400;letter-spacing:0;}
@media(max-width:900px){.sec{grid-template-columns:1fr;gap:4px;}.sec > .lbl{padding-top:0;}}

/* ============================================================ Kopf / Schriftfeld */
.top{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:1.5px solid var(--rule-3);}
.top-in{
  max-width:1560px;margin:0 auto;padding:16px 46px 14px;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
}
@media(max-width:900px){.top-in{padding:14px 18px 12px;}}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0;}
.bmark{
  font-family:"DM Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.12em;
  background:var(--brand);color:var(--on-accent);padding:3px 7px;flex:0 0 auto;align-self:center;
}
.brand h1{font-size:20px;font-weight:600;letter-spacing:-.025em;}
.brand .sub{
  font-family:"DM Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap;letter-spacing:.01em;
}
.brand .sub b{color:var(--ink-2);font-weight:500;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}

/* Schaltflächen: gezogene Rechtecke, kein Radius, kein Schatten. */
.btn{
  background:none;border:1px solid var(--rule-2);border-radius:1px;padding:6px 11px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:border-color .12s,color .12s;
}
.btn:hover{border-color:var(--ink);color:var(--ink);}
.btn.primary{background:var(--brand);border-color:var(--brand-edge);color:var(--on-accent);font-weight:600;}
.btn.primary:hover{filter:brightness(1.05);color:var(--on-accent);}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:1px;}
.seg button{background:none;border:0;padding:5px 10px;font-family:"DM Mono",monospace;font-size:11px;
  letter-spacing:.06em;color:var(--ink-3);cursor:pointer;}
.seg button+button{border-left:1px solid var(--rule-2);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

/* ============================================================ Steuerstreifen */
.filters{background:var(--paper-2);border-bottom:1px solid var(--rule);margin:0 -46px;padding:16px 46px 14px;}
@media(max-width:900px){.filters{margin:0 -18px;padding:14px 18px;}}
.frow{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;}
.frow + .frow{margin-top:12px;}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:0;}
.flabel{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
.fsep{width:1px;align-self:stretch;background:var(--rule-2);margin:2px 6px;}
.search{position:relative;}
.search input{width:236px;padding:6px 10px 6px 26px;border:1px solid var(--rule-2);border-radius:1px;background:var(--paper);}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
.dateIn{padding:5px 8px;border:1px solid var(--rule-2);border-radius:1px;background:var(--paper);width:132px;
  font-family:"DM Mono",monospace;font-size:12px;}
.range{display:flex;align-items:center;gap:8px;}
.range input[type=range]{width:88px;accent-color:var(--accent-line);}
.rangeVal{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-2);min-width:78px;}
.toggles{display:flex;gap:5px;flex-wrap:wrap;}
.tgl{
  border:1px solid var(--rule-2);background:none;border-radius:1px;padding:5px 10px;
  font-size:12px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.tgl:hover{border-color:var(--ink);color:var(--ink);}
.tgl[aria-pressed="true"]{background:var(--brand);border-color:var(--brand-edge);color:var(--on-accent);font-weight:600;}
.tgl .dot{width:6px;height:6px;background:var(--st-delay);}
.tgl[aria-pressed="true"] .dot{background:currentColor;}

/* Mehrfachauswahl */
.ms{position:relative;}
.ms-btn{
  display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:146px;max-width:224px;
  padding:6px 9px;border:1px solid var(--rule-2);border-radius:1px;background:var(--paper);cursor:pointer;
  font-size:12.5px;color:var(--ink);text-align:left;
}
.ms-btn:hover{border-color:var(--ink);}
.ms-btn .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-btn .cnt{font-family:"DM Mono",monospace;font-size:10.5px;background:var(--brand);color:var(--on-accent);padding:0 5px;flex:0 0 auto;}
.ms-btn .chev{color:var(--ink-3);flex:0 0 auto;font-size:10px;}
.ms-pop{
  position:absolute;z-index:80;top:calc(100% + 3px);left:0;min-width:268px;max-width:360px;
  background:var(--paper);border:1px solid var(--rule-3);padding:7px;display:none;
}
.ms.open .ms-pop{display:block;}
.ms-pop .msearch{width:100%;padding:5px 8px;border:1px solid var(--rule-2);border-radius:1px;background:var(--paper-2);margin-bottom:5px;}
.ms-list{max-height:262px;overflow:auto;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;font-size:12.5px;}
.ms-opt:hover{background:var(--paper-2);}
.ms-opt input{accent-color:var(--accent-line);margin:0;}
.ms-opt .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-opt .c{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--ink-3);}
.ms-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule);margin-top:6px;padding-top:6px;}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 3px;}
.linkbtn:hover{text-decoration:underline;}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);}
.chips.empty{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);padding:2px 3px 2px 8px;font-size:11.5px;color:var(--ink-2);}
.chip b{font-weight:600;color:var(--ink);}
.chip .k{font-family:"DM Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
.chip button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:13px;line-height:1;padding:2px 5px;}
.chip button:hover{color:var(--st-delay);}

/* ============================================================ Leitzahlen */
.kpis{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;margin:30px 0 0;}
.kpi{padding:0 30px 20px 0;margin-right:30px;position:relative;display:flex;flex-direction:column;gap:5px;}
.kpi + .kpi::before{content:"";position:absolute;left:-30px;top:4px;bottom:20px;width:1px;background:var(--rule);}
.kpi .lab{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.kpi .val{font-family:"DM Mono",monospace;font-size:26px;font-weight:400;line-height:1;letter-spacing:-.03em;color:var(--ink);}
.kpi .val .u{display:inline-block;font-size:.4em;letter-spacing:0;padding-left:.34em;color:var(--ink-3);vertical-align:.3em;}
.kpi .sub{font-size:11.5px;color:var(--ink-2);}
.kpi .meter{display:none;}
/* Zwei Leitzahlen tragen den Abschnitt, der Rest ist Beiwerk. */
.kpi.hero{padding-bottom:22px;}
.kpi.hero .val{font-size:56px;letter-spacing:-.045em;}
.kpi.hero .lab{font-size:10.5px;}
.kpi.hero .meter{display:block;height:2px;background:var(--rule);margin-top:3px;width:150px;}
.kpi.hero .meter i{display:block;height:100%;background:var(--ink);}
.kpi .val.warn{color:var(--st-delay);}

/* ============================================================ Abschnitte */
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:22px;border-top:1px solid var(--rule);}
@media(max-width:1240px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.card{
  padding:20px 26px 20px 0;margin-right:26px;border-bottom:1px solid var(--rule);
  display:flex;flex-direction:column;min-width:0;position:relative;
}
.card::before{content:"";position:absolute;right:0;top:20px;bottom:20px;width:1px;background:var(--rule);}
.grid2 .card:nth-child(3n)::before,.card.wide::before{display:none;}
@media(max-width:1240px){.grid2 .card:nth-child(3n)::before{display:block;}.grid2 .card:nth-child(2n)::before{display:none;}}
@media(max-width:820px){.card::before{display:none;}.card{margin-right:0;padding-right:0;}}
.card.wide{grid-column:span 2;}
@media(max-width:820px){.card.wide{grid-column:span 1;}}
.card-h{display:flex;align-items:baseline;gap:10px;}
.card-h h2{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
.card-h .hint{font-family:"DM Mono",monospace;font-size:10px;color:var(--ink-3);margin-left:auto;white-space:nowrap;letter-spacing:.04em;}
.card-sub{font-size:12px;color:var(--ink-3);margin:3px 0 16px;max-width:46ch;line-height:1.45;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;display:inline-block;}
.legend i.line{width:14px;height:2px;}
.empty-note{color:var(--ink-3);font-size:12.5px;padding:22px 0;}

/* ============================================================ Diagramme */
svg{display:block;overflow:visible;}
.chart{width:100%;}
.tick{font-family:"DM Mono",monospace;font-size:10px;fill:var(--ink-3);}
.gridline{stroke:var(--grid);stroke-width:1;}
.axisline{stroke:var(--axis);stroke-width:1;}
.barlab{font-family:"DM Mono",monospace;font-size:11px;fill:var(--ink);}
.catlab{font-size:11.5px;fill:var(--ink-2);}
.hit{fill:transparent;cursor:pointer;}
.mark{transition:opacity .12s ease;}

.tip{
  position:fixed;z-index:200;pointer-events:none;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule-3);padding:9px 11px;font-size:12px;max-width:330px;opacity:0;transition:opacity .1s ease;
}
.tip.on{opacity:1;}
.tip .t{font-weight:600;font-size:12.5px;margin-bottom:5px;}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:3px;}
.tip .r .k{width:12px;height:2px;flex:0 0 auto;}
.tip .r .k.sq{height:9px;width:9px;}
.tip .r .n{color:var(--ink-2);flex:1;}
.tip .r .v{font-family:"DM Mono",monospace;font-weight:500;}
.tip .meta{color:var(--ink-3);font-size:11px;margin-top:6px;border-top:1px solid var(--rule);padding-top:5px;}

/* ============================================================ Zeitachse */
.gantt-wrap{margin-top:20px;}
.gantt{display:grid;grid-template-columns:var(--labw,360px) 1fr;border:1px solid var(--rule-3);background:var(--paper);}
.g-lab-head,.g-time-head{height:42px;background:var(--paper-2);border-bottom:1px solid var(--rule-3);z-index:6;}
.g-time-head{position:relative;}
.g-lab-head{display:flex;align-items:center;padding:0 12px;gap:8px;border-right:1px solid var(--rule);}
.g-lab-head .th{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.g-labels{border-right:1px solid var(--rule);min-width:0;}
.g-scroll{overflow-x:auto;overflow-y:hidden;position:relative;}
.g-pane{position:relative;}
.g-row{height:28px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--rule);
  white-space:nowrap;overflow:hidden;font-size:12.5px;}
.g-row.alt{background:var(--band);}
.g-row .tw{width:15px;height:15px;flex:0 0 auto;border:1px solid var(--rule-2);background:none;
  color:var(--ink-2);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.g-row .tw:hover{border-color:var(--ink);}
.g-row .tw.blank{border:0;cursor:default;}
.g-row .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.g-row.ctx .nm{color:var(--ink-3);}
.g-row .lv{font-family:"DM Mono",monospace;font-size:9.5px;color:var(--ink-3);flex:0 0 auto;}
.g-row .pc{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink-2);flex:0 0 auto;width:34px;text-align:right;}
.g-row.lvl1 .nm{font-weight:600;}
.g-track{height:28px;border-bottom:1px solid var(--rule);position:relative;}
.g-track.alt{background:var(--band);}
.bar{position:absolute;height:8px;border-radius:1px;top:10px;cursor:pointer;}
.bar.roll{height:3px;top:12.5px;background:var(--rule-2);}
.bar.delayed{box-shadow:0 0 0 1px var(--paper),0 0 0 2.5px var(--st-delay);}
.g-today{position:absolute;top:0;bottom:0;width:1.5px;background:var(--today);z-index:3;pointer-events:none;}
.g-todaylab{position:absolute;top:1px;transform:translateX(-50%);font-family:"DM Mono",monospace;font-size:10px;
  color:var(--on-accent);background:var(--brand);padding:1px 6px;z-index:7;white-space:nowrap;}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid);pointer-events:none;}
.g-ticklab{position:absolute;top:24px;font-family:"DM Mono",monospace;font-size:10px;color:var(--ink-3);padding-left:5px;white-space:nowrap;}
.g-qlab{position:absolute;top:7px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-2);padding-left:5px;}
.g-axis-q .g-qlab{top:15px;}
.g-foot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:11.5px;color:var(--ink-2);}
