<title>IT Process Portfolio Cockpit</title>
<meta name="description" content="Management-Cockpit für das Corporate-IT-Prozessportfolio: Status, Verzögerungen, Auslastung und Timeline über alle Prozessgruppen." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" /></noscript>
<style>
/* ============================================================ tokens
   Corporate Design
   -----------------------------------------------------------------------
   Liebherr-Gelb ist Signalfarbe, Anthrazit der Träger. Gelb erscheint nur
   als FLÄCHE mit anthrazitfarbener Schrift darauf (11,2:1) - genau wie im
   Schriftzug. Als Linie, Text oder Datenmarke ist es auf Weiß mit 1,5:1
   unlesbar; dafür gibt es --accent-line (dunkles Gold) und --accent-ink.
   Die Datenfarben sind ein eigener, auf Farbfehlsichtigkeit geprüfter Satz
   und übernehmen das Markengelb bewusst nicht.
   Weichen die offiziellen CI-Werte ab, genügt es, diesen Block zu ändern.  */
:root{
  color-scheme: light;
  /* Marke */
  --brand:#FFCC00; --brand-edge:#B58E00; --on-accent:#1A1D1E;
  --grp-mp:#BDC4CA; --grp-cp:#FFCC00; --grp-sp:#8BB2C2;
  /* Flächen und Schrift */
  --ground:#EDECE8; --surface:#FFFFFF; --surface-2:#F6F5F1; --surface-3:#E9E8E1;
  --ink:#1A1D1E; --ink-2:#4E5254; --muted:#85888A;
  --line:#E2E1DA; --line-2:#C9C8C0; --ring:rgba(26,29,30,.10);
  --accent:#FFCC00; --accent-soft:#FFF3C7; --accent-ink:#7A5E00; --accent-line:#7A5E00;
  --focus:#7A5E00;
  --shadow:0 1px 2px rgba(26,29,30,.07), 0 8px 24px -14px rgba(26,29,30,.26);
  /* Datenfarben - Phasen (geprüft auf Weiß) */
  --ph1:#2a78d6; --ph2:#eb6834; --ph3:#1baf7a; --ph4:#7c5cd6;
  --ph1-soft:#dce8fa; --ph2-soft:#fbe4da; --ph3-soft:#d8f0e7; --ph4-soft:#e6e0fa;
  /* Status - reserviert, immer mit Symbol und Beschriftung */
  --st-done:#0ca30c; --st-prog:#2a78d6; --st-delay:#d03b3b;
  --st-sched:#85888A; --st-none:#BDC4CA;
  --st-done-soft:#ddf2dd; --st-prog-soft:#dce8fa; --st-delay-soft:#f9dedd;
  --st-sched-soft:#ecebe5; --st-none-soft:#f2f1eb;
  --warn:#8a6400; --today:#1A1D1E;
  /* Ordinalrampe (Trichter) */
  --or1:#86b6ef; --or2:#5598e7; --or3:#2a78d6; --or4:#1c5cab;
  --grid:#EBEAE3; --axis:#CFCEC6;
  --gantt-band:#F8F7F3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --brand:#FFCC00; --brand-edge:#FFCC00; --on-accent:#1A1D1E;
    --grp-mp:#BDC4CA; --grp-cp:#FFCC00; --grp-sp:#8BB2C2;
    --ground:#0F1112; --surface:#1A1D1E; --surface-2:#232729; --surface-3:#2C3133;
    --ink:#F4F4F1; --ink-2:#B9BCBC; --muted:#8B8F90;
    --line:#2C3032; --line-2:#3E4345; --ring:rgba(255,255,255,.10);
    --accent:#FFCC00; --accent-soft:#3A2F06; --accent-ink:#FFD84D; --accent-line:#FFCC00;
    --focus:#FFCC00;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.7);
    --ph1:#3987e5; --ph2:#d95926; --ph3:#199e70; --ph4:#9085e9;
    --ph1-soft:#17273A; --ph2-soft:#331910; --ph3-soft:#0E2B22; --ph4-soft:#241F3D;
    --st-done:#0ca30c; --st-prog:#3987e5; --st-delay:#d03b3b;
    --st-sched:#8B8F90; --st-none:#4A5052;
    --st-done-soft:#0D2511; --st-prog-soft:#17273A; --st-delay-soft:#341617;
    --st-sched-soft:#262A2B; --st-none-soft:#212525;
    --warn:#FFCC00; --today:#FFCC00;
    --or1:#184f95; --or2:#256abf; --or3:#3987e5; --or4:#6da7ec;
    --grid:#282C2E; --axis:#3E4345;
    --gantt-band:#1E2223;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand:#FFCC00; --brand-edge:#FFCC00; --on-accent:#1A1D1E;
  --grp-mp:#BDC4CA; --grp-cp:#FFCC00; --grp-sp:#8BB2C2;
  --ground:#0F1112; --surface:#1A1D1E; --surface-2:#232729; --surface-3:#2C3133;
  --ink:#F4F4F1; --ink-2:#B9BCBC; --muted:#8B8F90;
  --line:#2C3032; --line-2:#3E4345; --ring:rgba(255,255,255,.10);
  --accent:#FFCC00; --accent-soft:#3A2F06; --accent-ink:#FFD84D; --accent-line:#FFCC00;
  --focus:#FFCC00;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.7);
  --ph1:#3987e5; --ph2:#d95926; --ph3:#199e70; --ph4:#9085e9;
  --ph1-soft:#17273A; --ph2-soft:#331910; --ph3-soft:#0E2B22; --ph4-soft:#241F3D;
  --st-done:#0ca30c; --st-prog:#3987e5; --st-delay:#d03b3b;
  --st-sched:#8B8F90; --st-none:#4A5052;
  --st-done-soft:#0D2511; --st-prog-soft:#17273A; --st-delay-soft:#341617;
  --st-sched-soft:#262A2B; --st-none-soft:#212525;
  --warn:#FFCC00; --today:#FFCC00;
  --or1:#184f95; --or2:#256abf; --or3:#3987e5; --or4:#6da7ec;
  --grid:#282C2E; --axis:#3E4345;
  --gantt-band:#1E2223;
}

/* ============================================================ base */
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Barlow,"IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:.1px;}
button,select,input{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
.shell{max-width:1680px;margin:0 auto;padding:0 20px 72px;}
.tnum{font-variant-numeric:tabular-nums;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ============================================================ header */
.top{
  position:sticky;top:0;z-index:60;background:var(--surface);
  border-top:3px solid var(--brand);border-bottom:1px solid var(--line);
}
.top-in{max-width:1680px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.bmark{
  background:var(--brand);color:var(--on-accent);font-family:Barlow,sans-serif;font-weight:700;
  font-size:14px;letter-spacing:.4px;padding:4px 9px;border-radius:4px;flex:0 0 auto;line-height:1.15;
}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px;}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface);}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;}
.seg button+button{border-left:1px solid var(--line);}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
.btn{
  background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent-line);color:var(--accent-ink);}
.btn.primary{background:var(--accent);border-color:var(--brand-edge);color:var(--on-accent);font-weight:600;}
.btn.primary:hover{filter:brightness(1.06);}

/* ============================================================ filter bar */
.filters{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);margin:16px 0 0;padding:12px 14px;
}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.fgrp{display:flex;flex-direction:column;gap:5px;min-width:0;}
.flabel{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.fsep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px;}
.search{position:relative;}
.search input{
  width:230px;padding:7px 10px 7px 30px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);
}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);}
.dateIn{padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:135px;}
.range{display:flex;align-items:center;gap:8px;}
.range input[type=range]{width:96px;accent-color:var(--accent-line);}
.rangeVal{font-size:12px;color:var(--ink-2);min-width:74px;}
.toggles{display:flex;gap:6px;flex-wrap:wrap;}
.tgl{
  border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 11px;
  font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.tgl:hover{border-color:var(--accent-line);}
.tgl[aria-pressed="true"]{background:var(--accent);border-color:var(--brand-edge);color:var(--on-accent);font-weight:600;}
.tgl .dot{width:7px;height:7px;border-radius:50%;background:var(--st-delay);}
.tgl[aria-pressed="true"] .dot{background:currentColor;}

/* multiselect */
.ms{position:relative;}
.ms-btn{
  display:flex;align-items:center;gap:8px;justify-content:space-between;
  min-width:150px;max-width:230px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink);text-align:left;
}
.ms-btn:hover{border-color:var(--accent-line);}
.ms-btn .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-btn .cnt{
  font-size:11px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px;flex:0 0 auto;
}
.ms-btn .chev{color:var(--muted);flex:0 0 auto;}
.ms-pop{
  position:absolute;z-index:80;top:calc(100% + 5px);left:0;min-width:270px;max-width:360px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);
  padding:8px;display:none;
}
.ms.open .ms-pop{display:block;}
.ms-pop .msearch{width:100%;padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);margin-bottom:6px;}
.ms-list{max-height:264px;overflow:auto;display:flex;flex-direction:column;gap:1px;}
.ms-opt{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;
}
.ms-opt:hover{background:var(--surface-2);}
.ms-opt input{accent-color:var(--accent-line);margin:0;}
.ms-opt .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-opt .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.ms-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:7px;padding-top:7px;}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;}
.linkbtn:hover{text-decoration:underline;}

/* active chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.chips.empty{display:none;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px 5px 3px 10px;font-size:12px;color:var(--ink-2);
}
.chip b{font-weight:600;color:var(--ink);}
.chip .k{color:var(--muted);}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:50%;}
.chip button:hover{background:var(--st-delay-soft);color:var(--st-delay);}

/* ============================================================ kpi */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:16px;}
@media(max-width:1420px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:780px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;
}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st-sched);}
.kpi .lab{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.kpi .val{font-family:Barlow,sans-serif;font-size:31px;font-weight:700;line-height:1.05;letter-spacing:-.5px;}
.kpi .sub{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;}
.kpi .meter{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:2px;}
.kpi .meter i{display:block;height:100%;border-radius:2px;background:var(--accent-line);}

/* ============================================================ cards */
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;}
@media(max-width:1240px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:14px 16px 12px;display:flex;flex-direction:column;min-width:0;
}
.card.wide{grid-column:span 2;}
@media(max-width:820px){.card.wide{grid-column:span 1;}}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;}
.card-h h2{font-size:14.5px;font-weight:600;}
.card-h .hint{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:10px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink-2);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.legend i.line{width:14px;height:2px;border-radius:1px;}
.empty-note{color:var(--muted);font-size:12.5px;padding:22px 0;text-align:center;}

/* ============================================================ charts */
svg{display:block;overflow:visible;}
.chart{width:100%;}
.tick{font-size:10.5px;fill:var(--muted);}
.gridline{stroke:var(--grid);stroke-width:1;}
.axisline{stroke:var(--axis);stroke-width:1;}
.barlab{font-size:11px;fill:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;}
.catlab{font-size:11.5px;fill:var(--ink-2);}
.hit{fill:transparent;cursor:pointer;}
.mark{transition:opacity .12s ease;}
.dim .mark{opacity:.35;}
.dim .mark.on{opacity:1;}

/* tooltip */
.tip{
  position:fixed;z-index:200;pointer-events:none;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);padding:9px 11px;
  font-size:12px;max-width:330px;opacity:0;transition:opacity .1s ease;
}
.tip.on{opacity:1;}
.tip .t{font-weight:600;font-size:12.5px;margin-bottom:5px;}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:3px;}
.tip .r .k{width:12px;height:2px;border-radius:1px;flex:0 0 auto;}
.tip .r .k.sq{height:10px;width:10px;border-radius:3px;}
.tip .r .n{color:var(--ink-2);flex:1;}
.tip .r .v{font-weight:700;font-variant-numeric:tabular-nums;}
.tip .meta{color:var(--muted);font-size:11px;margin-top:6px;border-top:1px solid var(--line);padding-top:5px;}

/* ============================================================ gantt */
.gantt-wrap{margin-top:14px;}
.gantt{display:grid;grid-template-columns:var(--labw,360px) 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);}
.g-lab-head,.g-time-head{
  height:46px;background:var(--surface-2);border-bottom:1px solid var(--line);z-index:6;
}
.g-time-head{position:relative;}
.g-lab-head{display:flex;align-items:center;padding:0 12px;gap:8px;border-right:1px solid var(--line);}
.g-lab-head .th{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.g-body{display:contents;}
.g-labels{border-right:1px solid var(--line);min-width:0;}
.g-scroll{overflow-x:auto;overflow-y:hidden;position:relative;}
.g-pane{position:relative;}
.g-row{
  height:30px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;font-size:12.5px;
}
.g-row.alt{background:var(--gantt-band);}
.g-row .tw{width:16px;height:16px;flex:0 0 auto;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);
  color:var(--ink-2);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.g-row .tw.blank{border:0;background:none;cursor:default;}
.g-row .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.g-row.ctx .nm{color:var(--muted);}
.g-row .lv{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--surface-3);border-radius:4px;padding:1px 5px;flex:0 0 auto;}
.g-row .pc{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto;width:34px;text-align:right;}
.g-row.lvl1 .nm{font-weight:600;}
.g-row.grp{background:var(--surface-3);font-weight:700;}
.g-track{height:30px;border-bottom:1px solid var(--line);position:relative;}
.g-track.alt{background:var(--gantt-band);}
.bar{position:absolute;height:9px;border-radius:4px;top:10px;cursor:pointer;}
.bar.roll{height:5px;top:12px;border-radius:3px;background:var(--st-sched);opacity:.45;}
.bar .cap{position:absolute;right:-3px;top:-4px;font-size:9px;}
.bar.delayed{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--st-delay);}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.85;z-index:3;pointer-events:none;}
.g-todaylab{position:absolute;top:1px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--on-accent);background:var(--brand);padding:1px 6px;border-radius:4px;z-index:7;white-space:nowrap;}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid);pointer-events:none;}
.g-ticklab{position:absolute;top:26px;font-size:10.5px;color:var(--muted);padding-left:5px;white-space:nowrap;}
.g-qlab{position:absolute;top:7px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);padding-left:5px;text-transform:uppercase;}
.g-axis-q .g-qlab{top:15px;}
.g-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:11.5px;color:var(--ink-2);}
.g-foot i{width:14px;height:8px;border-radius:3px;display:inline-block;}

/* ============================================================ table */
.tbl-wrap{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
.tbl-head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tbl-scroll{overflow-x:auto;max-height:640px;overflow-y:auto;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
thead th{
  position:sticky;top:0;background:var(--surface-2);z-index:2;text-align:left;font-weight:600;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--accent-ink);}
thead th .ar{opacity:.35;margin-left:3px;}
thead th[aria-sort] .ar{opacity:1;color:var(--accent-ink);}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
